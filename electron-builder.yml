appId: com.upnext.app
productName: Up Next
copyright: Copyright © 2026

directories:
  buildResources: build
  output: dist

files:
  - out/**
  # Referenced from main via ?asset, which resolves at runtime rather than
  # copying into out/ (electron-vite public directory).
  - resources/**
  - package.json

# Runtime integrity (docs/spec.md §8.8).
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
  enableCookieEncryption: true

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - arm64
  # `identity` is deliberately absent. electron-builder imports the Developer ID
  # Application certificate from CSC_LINK into a temporary keychain and finds it
  # itself. Setting `identity: null` would not pin the certificate, it would
  # disable signing entirely.
  hardenedRuntime: true
  # Left off because electron-builder assesses between signing and stapling,
  # where Gatekeeper cannot yet accept the app. The release workflow runs
  # spctl against the finished bundle instead.
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    # Menu-bar app: no Dock icon (§10).
    LSUIElement: true
  # Submitted to Apple during packaging, authenticated with the App Store
  # Connect API key in APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER.
  # The resulting ticket is stapled into the bundle, so Gatekeeper accepts the
  # app on first launch without a network round trip.
  notarize: true

dmg:
  # Slug, not ${productName}: that holds a space, which survives into the
  # release URL as %20 and into every cask that has to quote it.
  artifactName: up-next-${version}-${arch}.${ext}

# Declared so electron-builder knows where the DMG is destined, but it never
# uploads: the release workflow runs --publish never and creates the release
# with `gh` afterwards, because letting electron-builder do it raced the DMG
# against its own blockmap and silently dropped the DMG.
#
# The app itself never checks for updates — no electron-updater, no update
# server. Homebrew is the update channel, and the cask pins a SHA-256 per
# release (§8.8).
publish:
  provider: github
  releaseType: release
