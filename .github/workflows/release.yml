name: Release

# Tag a version to build the DMG and publish it as a GitHub Release
# (docs/spec.md §9, Phase 4).
#
# The build is ad-hoc signed and not notarised: there is no Apple Developer
# account, so there is no Developer ID to sign with and nothing Apple will
# notarise (docs/homebrew-plan.md). The job prints the SHA-256 of the DMG,
# which is the value the Homebrew cask has to pin.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-15
    environment: release
    permissions:
      contents: write # create the GitHub Release
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # electron-builder names the release from package.json, not from the tag
      # that triggered this. If they disagree it tries to publish against a tag
      # that does not exist and fails late, after a full build, with a 422 that
      # does not say so.
      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch Electron binary
        run: node node_modules/electron/install.js

      - name: Verify registry signatures
        run: npm audit signatures

      - name: Audit dependencies
        run: npm run audit

      # This is where the OAuth client is baked in: electron-vite inlines
      # MAIN_VITE_* at build time (§8.3). Setting it on the packaging step
      # instead would produce an app that installs and cannot sign in.
      - name: Build
        run: npm run build
        env:
          MAIN_VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          MAIN_VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

      # A missing or misnamed secret does not fail the build; it produces an app
      # that installs, launches, and cannot sign in to Google. Catch it here.
      - name: Check the OAuth client was baked in
        run: |
          grep -q 'apps.googleusercontent.com' out/main/index.js || {
            echo "::error::no Google client id in the bundle — check the release environment secrets"
            exit 1
          }

      # --publish never, and the release is created below instead. Letting
      # electron-builder publish raced the DMG against its own blockmap: both
      # uploads found no release, both created one, and the DMG lost and was
      # dropped without an error. The step still passed.
      - name: Package
        run: npx electron-builder --mac --publish never

      # The signature is worth nothing to Gatekeeper without a Developer ID, but
      # it still has to be there and cover the hardened runtime, or the DMG is
      # unusable on arm64. Fail the release rather than publish a broken one.
      - name: Verify the signature
        run: |
          app="dist/mac-arm64/Up Next.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=2 "$app" 2>&1 | tee /tmp/sig.txt
          grep -q 'flags=.*runtime' /tmp/sig.txt || {
            echo "::error::the hardened runtime is missing from the signature"
            exit 1
          }

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          dmg="dist/up-next-$version-arm64.dmg"
          sha=$(shasum -a 256 "$dmg" | cut -d' ' -f1)

          cat > /tmp/notes.md <<EOF
          Apple silicon, macOS Sonoma or newer.

          \`\`\`sh
          brew tap edspressomartini/tap
          brew install --cask up-next
          \`\`\`

          **macOS will refuse to open this the first time.** Up Next is not
          notarised by Apple, so after trying to open it, go to System Settings
          → Privacy & Security and click **Open Anyway**. You will need to do
          this again after each upgrade.
          [What that means](https://upnextapp.co.uk/security.html).

          Verify the download before you trust it:

          \`\`\`sh
          shasum -a 256 up-next-$version-arm64.dmg
          # $sha
          \`\`\`
          EOF

          gh release create "$GITHUB_REF_NAME" "$dmg" \
            --title "$version" \
            --notes-file /tmp/notes.md

          {
            echo "### Homebrew cask"
            echo '```ruby'
            echo "  version \"$version\""
            echo "  sha256 \"$sha\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
