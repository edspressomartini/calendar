appId: com.upnext.app
productName: Up Next
copyright: Copyright © 2026

directories:
  buildResources: build
  output: dist

files:
  - out/**
  # Referenced from main via ?asset, which resolves at runtime rather than
  # copying into out/ (electron-vite public directory).
  - resources/**
  - package.json

# Runtime integrity (docs/spec.md §8.8).
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
  enableCookieEncryption: true

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - arm64
  # Ad-hoc. There is no Apple Developer account, so there is no Developer ID
  # to sign with, and an unsigned arm64 binary will not execute at all.
  #
  # The hardened runtime stays on. It needs the disable-library-validation
  # entitlement to tolerate an ad-hoc signature, which has no Team ID for the
  # app's own Electron framework to match — see build/entitlements.mac.plist.
  # That relaxes one protection and keeps the rest, which is strictly better
  # than turning the runtime off and losing all of them.
  #
  # The day a Developer ID exists: `identity: null`, `notarize: true`, and
  # delete the entitlement (docs/homebrew-plan.md).
  identity: '-'
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    # Menu-bar app: no Dock icon (§10).
    LSUIElement: true
  # Notarisation needs a Developer ID, which an ad-hoc signature is not.
  notarize: false

dmg:
  # Slug, not ${productName}: that holds a space, which survives into the
  # release URL as %20 and into every cask that has to quote it.
  artifactName: up-next-${version}-${arch}.${ext}

# Declared so electron-builder knows where the DMG is destined, but it never
# uploads: the release workflow runs --publish never and creates the release
# with `gh` afterwards, because letting electron-builder do it raced the DMG
# against its own blockmap and silently dropped the DMG.
#
# The app itself never checks for updates — no electron-updater, no update
# server. Homebrew is the update channel, and the cask pins a SHA-256 per
# release (§8.8).
publish:
  provider: github
  releaseType: release
