name: Release

# Tag a version to build the DMG and publish it as a GitHub Release
# (docs/spec.md §9, Phase 4).
#
# The build is signed with a Developer ID Application certificate and notarised
# by Apple, so macOS opens it without the user overriding Gatekeeper
# (docs/apple-signing-plan.md). The job prints the SHA-256 of the DMG, which is
# the value the Homebrew cask has to pin.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-15
    # The signing certificate and the notarisation key live here rather than in
    # repository secrets, and the environment only accepts deployments from a
    # `v*` tag. A workflow on a branch cannot read them even if it asks.
    environment: release
    permissions:
      contents: write # create the GitHub Release
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # electron-builder names the release from package.json, not from the tag
      # that triggered this. If they disagree it tries to publish against a tag
      # that does not exist and fails late, after a full build, with a 422 that
      # does not say so.
      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch Electron binary
        run: node node_modules/electron/install.js

      - name: Verify registry signatures
        run: npm audit signatures

      - name: Audit dependencies
        run: npm run audit

      # This is where the OAuth client is baked in: electron-vite inlines
      # MAIN_VITE_* at build time (§8.3). Setting it on the packaging step
      # instead would produce an app that installs and cannot sign in.
      - name: Build
        run: npm run build
        env:
          MAIN_VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          MAIN_VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

      # A missing or misnamed secret does not fail the build; it produces an app
      # that installs, launches, and cannot sign in to Google. Catch it here.
      - name: Check the OAuth client was baked in
        run: |
          grep -q 'apps.googleusercontent.com' out/main/index.js || {
            echo "::error::no Google client id in the bundle — check the release environment secrets"
            exit 1
          }

      # @electron/notarize wants a path to the .p8, not its contents, so the
      # base64 secret has to land on disk. The runner is a single-use VM that
      # is destroyed after the job, so there is nothing to clean up.
      - name: Write the notarisation key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      # --publish never, and the release is created below instead. Letting
      # electron-builder publish raced the DMG against its own blockmap: both
      # uploads found no release, both created one, and the DMG lost and was
      # dropped without an error. The step still passed.
      #
      # This step blocks on Apple: electron-builder signs, uploads to the
      # notary service, waits for a verdict, then staples the ticket into the
      # bundle before building the DMG around it. Usually a few minutes.
      - name: Package
        env:
          # electron-builder imports this into a throwaway keychain itself.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npx electron-builder --mac --publish never

      # Four separate claims, because a build can satisfy any three and still be
      # unusable: the signature is intact, it is the Developer ID certificate
      # rather than an ad-hoc or development one, the hardened runtime is on,
      # and Apple's notarisation ticket is stapled into the bundle.
      #
      # The last two matter most. Notarisation that silently did not happen
      # produces a DMG that looks fine here and refuses to open everywhere else.
      - name: Verify the signature and notarisation
        run: |
          app="dist/mac-arm64/Up Next.app"

          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=4 "$app" 2>&1 | tee /tmp/sig.txt

          grep -q 'flags=.*runtime' /tmp/sig.txt || {
            echo "::error::the hardened runtime is missing from the signature"
            exit 1
          }
          grep -q 'Authority=Developer ID Application:' /tmp/sig.txt || {
            echo "::error::not signed with a Developer ID Application certificate"
            exit 1
          }

          # Proves the ticket is in the bundle rather than that Apple would
          # issue one if asked. It does reach Apple to check the ticket is still
          # valid, though, which failed a 0.6.0 build outright on a dropped
          # connection after notarisation had already succeeded — so a network
          # error is retried and only a real verdict is allowed to fail the job.
          for attempt in 1 2 3; do
            xcrun stapler validate "$app" 2>&1 | tee /tmp/staple.txt && break

            grep -qi 'network\|CloudKit' /tmp/staple.txt || {
              echo "::error::the notarisation ticket is not stapled into the bundle"
              exit 1
            }
            echo "::warning::stapler could not reach Apple (attempt $attempt), retrying"
            sleep $((attempt * 20))
          done
          grep -q 'The validate action worked!' /tmp/staple.txt || {
            echo "::error::stapler never got a verdict from Apple"
            exit 1
          }

          # Trustworthy here and nowhere else. On macOS 15+ spctl reports
          # against a policy engine the system no longer consults when
          # deciding whether to launch something, so on a user's machine it
          # can say rejected about an app that opens without a dialog. A
          # GitHub runner has a known-default policy, which is what makes it
          # a usable assertion in this one place.
          spctl --assess --type execute --verbose=4 "$app" 2>&1 | tee /tmp/spctl.txt
          grep -q 'source=Notarized Developer ID' /tmp/spctl.txt || {
            echo "::error::Gatekeeper did not accept the app as notarised"
            exit 1
          }

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          dmg="dist/up-next-$version-arm64.dmg"
          sha=$(shasum -a 256 "$dmg" | cut -d' ' -f1)

          cat > /tmp/notes.md <<EOF
          Apple silicon, macOS Sonoma or newer.

          \`\`\`sh
          brew tap edspressomartini/tap
          brew install --cask up-next
          \`\`\`

          Signed with a Developer ID and notarised by Apple, so it opens
          normally. [How it is built and what it can reach](https://upnextapp.co.uk/security.html).

          Verify the download before you trust it:

          \`\`\`sh
          shasum -a 256 up-next-$version-arm64.dmg
          # $sha
          \`\`\`
          EOF

          gh release create "$GITHUB_REF_NAME" "$dmg" \
            --title "$version" \
            --notes-file /tmp/notes.md

          {
            echo "### Homebrew cask"
            echo '```ruby'
            echo "  version \"$version\""
            echo "  sha256 \"$sha\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The cask was bumped by hand until 0.6.0, and twice the release went out
      # with the tap still pinned to the previous version — so `brew upgrade`
      # reported everything up to date while a newer DMG sat on the Releases
      # page. A published release nobody can install is not a release.
      #
      # Separate repository, so `github.token` does not reach it. TAP_TOKEN is a
      # fine-grained PAT scoped to homebrew-tap alone with contents:write and
      # nothing else; it lives in the `release` environment, which only accepts
      # deployments from a `v*` tag, so a workflow on a branch cannot read it.
      #
      # Contents API rather than a clone: one authenticated call, the token
      # never touches the git config or the disk, and passing the blob sha
      # means a concurrent change to the tap rejects the write instead of
      # silently overwriting it.
      - name: Update the Homebrew cask
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
          TAP: edspressomartini/homebrew-tap
          CASK: Casks/up-next.rb
        run: |
          version="${GITHUB_REF_NAME#v}"
          dmg="dist/up-next-$version-arm64.dmg"
          sha=$(shasum -a 256 "$dmg" | cut -d' ' -f1)

          gh api "/repos/$TAP/contents/$CASK" -q .sha > /tmp/blob.sha
          gh api "/repos/$TAP/contents/$CASK" -q .content | base64 --decode > /tmp/cask.rb

          # Anchored to the line start so the url template, which also contains
          # the word version, is left alone.
          sed -i '' \
            -e "s|^  version \".*\"|  version \"$version\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"$sha\"|" \
            /tmp/cask.rb

          # A sed that matched nothing exits 0 and leaves the old pin in place,
          # which is the failure this step exists to prevent.
          grep -q "^  version \"$version\"$" /tmp/cask.rb || {
            echo "::error::the cask version line did not update — has the file changed shape?"
            exit 1
          }
          grep -q "^  sha256 \"$sha\"$" /tmp/cask.rb || {
            echo "::error::the cask sha256 line did not update"
            exit 1
          }

          gh api --method PUT "/repos/$TAP/contents/$CASK" \
            -f message="chore: up-next $version" \
            -f content="$(base64 -i /tmp/cask.rb)" \
            -f sha="$(cat /tmp/blob.sha)" \
            --silent
