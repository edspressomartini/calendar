name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default (docs/spec.md §8.9).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    steps:
      # Actions are pinned by commit SHA, not by tag (§8.9).
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # .npmrc sets ignore-scripts, so Electron's binary is fetched explicitly.
      - name: Install dependencies
        run: npm ci

      - name: Fetch Electron binary
        run: node node_modules/electron/install.js

      - name: Verify registry signatures
        run: npm audit signatures

      # Not plain `npm audit`: see the exception list in scripts/audit.ts.
      - name: Audit dependencies
        run: npm run audit

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test

      # Run directly rather than through `npm run test:swift`, whose job is to
      # skip gracefully off macOS. On this runner a missing toolchain is a
      # broken job, not a skip.
      - name: Test the EventKit helper
        run: swift test --package-path resources/eventkit-helper

      - name: Build
        run: npm run build
